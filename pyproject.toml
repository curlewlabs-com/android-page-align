[build-system]
requires = ["flit_core==4.2.0"]
build-backend = "flit_core.buildapi"

[project]
name = "android-page-align"
version = "0.1.1"
description = "Check that every native library in an Android APK or app bundle can load on 16 KB memory pages."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Curlew Labs" }]
# The python3 the current Ubuntu hosted runner image ships; the package's
# __init__ refuses anything older with a message.
requires-python = ">=3.12"
# Nothing from PyPI: the package runs on the standard library alone.
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
android-page-align = "android_page_align.check:main"

[project.urls]
Repository = "https://github.com/curlewlabs-com/android-page-align"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
